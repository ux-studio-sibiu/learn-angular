<header class="site-header">
  <a class="brand" routerLink="/">learn-angular</a>
  <nav class="site-nav">
    <!-- routerLink ≈ next/link; routerLinkActive adds the class when the URL matches -->
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Roadmap</a>
    <a routerLink="/lessons/setup" routerLinkActive="is-active">00 Setup</a>
    <a routerLink="/lessons/components" routerLinkActive="is-active">01 Components</a>
    <a routerLink="/lessons/control-flow" routerLinkActive="is-active">02 Control flow</a>
    <a routerLink="/lessons/signals" routerLinkActive="is-active">03 Signals</a>
    <a routerLink="/lessons/inputs" routerLinkActive="is-active">04 Inputs</a>
    <a routerLink="/lessons/services" routerLinkActive="is-active">05 Services</a>
    <a routerLink="/lessons/routing" routerLinkActive="is-active">06 Routing</a>
    <a routerLink="/lessons/http" routerLinkActive="is-active">07 HTTP</a>
    <a routerLink="/lessons/forms" routerLinkActive="is-active">08 Forms</a>
  </nav>
  <!-- Lesson 05: the header and the lesson page are far apart in the tree, but inject the same FavoritesStore instance -->
  <a class="favorites-badge" routerLink="/lessons/services" [class.has-items]="favorites.count() > 0" aria-label="Favorites">★ {{ favorites.count() }}</a>
</header>

<main class="site-main">
  <!-- ≈ Next.js {children} in layout.tsx: the matched route's component renders here -->
  <router-outlet />
</main>
